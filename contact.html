<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- عنوان الصفحة يحتوي على الرقم الجامعي والاسم الكامل -->
    <title>166769 - Contact Me | Noor Nizar Bani Hani</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.7;
        }

        /* Navigation Bar Menu */
        nav {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.2rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .nav-logo {
            color: #fff;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .nav-logo span {
            color: #60a5fa;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #fff;
            background: var(--accent);
        }

        .container {
            max-width: 650px;
            margin: 4rem auto;
            padding: 0 1.5rem;
        }

        .form-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-title {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .form-subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--primary);
            font-size: 0.9rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
            background: #fff;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        .submit-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 2rem;
            background: var(--primary);
            color: #94a3b8;
            margin-top: 5rem;
        }
    </style>
</head>
<body>

    <!-- Navigation Menu -->
    <nav>
        <div class="nav-logo">JUST <span>Portfolio</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="contact.html" class="active">Contact Me</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="form-card">
            <h2 class="form-title">Get In Touch</h2>
            <p class="form-subtitle">Feel free to leave a message or inquiry below.</p>

            <form id="contactForm">
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="country">Country *</label>
                    <select id="country">
                        <option value="">Select your country...</option>
                        <option value="Jordan">Jordan</option>
                        <option value="Saudi Arabia">Saudi Arabia</option>
                        <option value="UAE">United Arab Emirates</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="comments">Comments / Message *</label>
                    <textarea id="comments" rows="5" placeholder="Write your message here..."></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fa-solid fa-paper-plane"></i> Submit Form
                </button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Noor Nizar Bani Hani - Jordan University of Science and Technology (JUST)</p>
    </footer>

    <!-- JavaScript Validation & Alert (متطلب أساسي للواجب) -->
    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const country = document.getElementById('country').value.trim();
            const comments = document.getElementById('comments').value.trim();

            // التحقق من تعبئة كافة الحقول
            if (!fullName || !email || !country || !comments) {
                alert('Please fill in all the required fields before submitting.');
                return;
            }

            // رسالة النجاح عند الإرسال
            alert('Success! Your message has been submitted successfully.');
            
            // إعادة ضبط النموذج
            this.reset();
        });
    </script>

</body>
</html>
